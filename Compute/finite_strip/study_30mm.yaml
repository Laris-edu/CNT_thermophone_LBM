# 30 mm cross-section, invariant in z; the 30 mm z length records the
# requested specimen and power normalization, not simulated z-edge physics.
base_config: ../open_planar/e1_long_air.yaml

defaults:
  collision_backend: cupy
  width_m: 0.031
  height_m: 0.0002
  film_width_m: 0.030
  frequency_Hz: 20000.0
  mean_power_W_m2: 1255.5555555555557
  C_A_J_m2K: 0.012888
  sheet_conductance_W_K: 5.7996e-7
  G_W_m2K: 0.0
  initial_temperature_K: 300.0
  cycles: 24
  stop_when_stable: true
  field_samples_per_cycle: 32
  sponge_width_m: 0.0
  sponge_rate: 0.0
  pml_width_m: 0.00008
  pml_target_return: 0.001
  pml_alpha_Hz: 1000.0
  handoff_contours_m:
    - [0.01535, 0.00009]
    - [0.01540, 0.00010]
    - [0.01541, 0.00011]
  validation_probes_m:
    - [0.0, 0.000115]
    - [-0.015415, 0.00005]
    - [0.015415, 0.00005]
  probe_radius_m: 0.000075
material:
  description: Literature-constructed aligned porous CNT equivalent sheet; not a measured specimen.
  source: https://doi.org/10.1021/nn507117a
  supplement: https://pstorage-acs-6854636.s3.amazonaws.com/3798106/nn507117a_si_001.pdf
  source_section: S4.1
  thickness_m: 18e-6
  apparent_density_kg_m3: 1.0
  adopted_specific_heat_J_kgK: 716.0
  along_alignment_diffusivity_m2_s: 45e-6
  nominal_specimen_width_m: 0.030
  nominal_specimen_length_z_m: 0.030
  nominal_projected_area_m2: 0.0009
  nominal_mean_total_power_W: 1.13
  assumption: Zero-thickness impermeable effective wall, invariant in z; no finite-z edges, pore-scale exchange, electrode, or support model.
cases:
  # The centred pulse first sees side returns near 89 us. The 100 us
  # window includes them; isolated and reference returns remain outside it.
  - name: pulse_candidate_dx10um
    kind: pulse
    film_width_m: 0.0
    dx_m: 1.0e-5
    duration_s: 0.0001
    pulse_sigma_m: 2.0e-5
    pulse_amplitude_Pa: 1.0
    probe_radius_m: 0.00005
  - name: pulse_reference_dx10um
    kind: pulse
    film_width_m: 0.0
    dx_m: 1.0e-5
    width_m: 0.038
    height_m: 0.019
    duration_s: 0.0001
    pulse_sigma_m: 2.0e-5
    pulse_amplitude_Pa: 1.0
    probe_radius_m: 0.00005
  - name: pulse_sides_dx10um
    kind: pulse
    film_width_m: 0.0
    dx_m: 1.0e-5
    height_m: 0.018
    duration_s: 0.0001
    pulse_sigma_m: 2.0e-5
    pulse_amplitude_Pa: 1.0
    probe_radius_m: 0.00005
  - name: pulse_top_dx10um
    kind: pulse
    film_width_m: 0.0
    dx_m: 1.0e-5
    width_m: 0.036
    duration_s: 0.0001
    pulse_sigma_m: 2.0e-5
    pulse_amplitude_Pa: 1.0
    probe_radius_m: 0.00005
  - name: power_r2
    kind: power
    dx_m: 1.305875e-6
validation:
  pulse_return_start_s: 0.0
  pulse_return_error_limit: 0.01
  propagation_amplitude_relative: 0.01
  propagation_phase_deg: 1.0
  note: A passed coarse broadband pulse is insufficient for 20 kHz or thermoviscous grid validation.
