base_config: ../open_planar/e1_long_air.yaml
defaults:
  refine: 4
  length_m: 0.00100030025
  frequency_Hz: 20000.0
  probes_m:
  - 0.00012
  - 0.0003
  - 0.0006
  sampling:
    probe_interpolation: linear
    sync_fine_steps: 2
    profile_samples_per_cycle: 32
cases:
- name: pulse_up_populations
  mode: interface_pulse
  probes_m: &id001
  - 0.00037511259375
  - 0.0006248611875
  interface_pulse: &id002
    direction: 1
    epsilon: 1.0e-05
    center_fraction: 0.25
    width_fraction: 0.025
    interface_m: 0.000500150125
    sync_steps: 388
  state_representation: populations
- name: pulse_up_moments9
  mode: interface_pulse
  probes_m: *id001
  interface_pulse: *id002
  state_representation: moments9
- name: pulse_down_populations
  mode: interface_pulse
  probes_m: &id003
  - 0.00037511259375
  - 0.0006248611875
  interface_pulse: &id004
    direction: -1
    epsilon: 1.0e-05
    center_fraction: 0.75
    width_fraction: 0.025
    interface_m: 0.000500150125
    sync_steps: 388
  state_representation: populations
- name: pulse_down_moments9
  mode: interface_pulse
  probes_m: *id003
  interface_pulse: *id004
  state_representation: moments9
- name: step_populations
  mode: thermal_step
  amplitude_K: 0.1
  thermal_step: &id005
    duration_s: 5.0e-06
    interface_m: 2.0894e-05
  state_representation: populations
- name: step_moments9
  mode: thermal_step
  amplitude_K: 0.1
  thermal_step: *id005
  state_representation: moments9
- name: thermal_populations
  mode: thermal
  amplitude_K: 0.1
  cycles: 6.0
  ramp_cycles: 2.0
  analysis: &id006
    window_cycles: 2.0
  state_representation: populations
- name: thermal_moments9
  mode: thermal
  amplitude_K: 0.1
  cycles: 6.0
  ramp_cycles: 2.0
  analysis: *id006
  state_representation: moments9
- name: power_populations
  mode: power
  cycles: 20.0
  power: &id007
    mean_W: 1.13
    area_m2: 0.0009
  film: &id008
    C_A_J_m2K: 0.0007
    G_W_m2K: 57.8
    T_ref_K: 300.0
    initial_temperature_K: 300.0
    gas_flux_factor: 2.0
  stopping: &id009
    stop_when_stable: false
  state_representation: populations
- name: power_moments9
  mode: power
  cycles: 20.0
  power: *id007
  film: *id008
  stopping: *id009
  state_representation: moments9
